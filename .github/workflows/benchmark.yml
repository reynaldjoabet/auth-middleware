name: Load test

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: Rounds
        required: false
        default: '5'
      duration:
        description: Duration per scenario
        required: false
        default: '30s'

permissions:
  contents: read

concurrency:
  group: benchmark
  cancel-in-progress: true

jobs:
  start-service:
    name: Start benchmark service
    runs-on: [self-hosted, benchmark-service]
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Install service dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server
          sudo systemctl stop redis-server || true
          printf '%s\n' /usr/lib/postgresql/*/bin | sort -V | tail -1 >> "$GITHUB_PATH"

      - name: Start service
        env:
          STORE: redis
        run: |
          nohup ./run.sh > /tmp/auth-middleware.log 2>&1 &
          echo $! > /tmp/auth-middleware.pid

  load-test:
    name: Run load test
    needs: start-service
    runs-on: [self-hosted, benchmark-load]
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Install load-test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wrk
          echo "cores: $(nproc), memory: $(free -g | awk '/Mem:/ {print $2}') GB"

      - name: Wait for service
        env:
          SERVICE_URL: http://benchmark-service:8080
        run: |
          for attempt in {1..60}; do
            curl --fail --silent "$SERVICE_URL/health" && exit 0
            sleep 2
          done
          echo "Service did not become ready"
          exit 1

      - name: Run load test
        env:
          STORE: redis
          SERVICE_URL: http://benchmark-service:8080
          ROUNDS: ${{ inputs.rounds || '5' }}
          DURATION: ${{ inputs.duration || '30s' }}
          DPOP_DURATION: 10s
          PROOFS: '60000'
        run: ./bench/loadtest/run.sh

      - name: Job summary
        if: always()
        run: |
          if [[ -f target/bench-results/summary.md ]]; then
            cat target/bench-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No benchmark summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ github.run_id }}
          path: target/bench-results/
          retention-days: 30
          if-no-files-found: ignore

  stop-service:
    name: Stop benchmark service
    if: always()
    needs: [start-service, load-test]
    runs-on: [self-hosted, benchmark-service]

    steps:
      - name: Stop service
        run: |
          if [[ -f /tmp/auth-middleware.pid ]]; then
            kill "$(cat /tmp/auth-middleware.pid)" || true
            rm -f /tmp/auth-middleware.pid
          fi
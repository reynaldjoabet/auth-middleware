# HAProxy in front of auth-middleware nodes — reference configuration.
#
# What this layer is for:
#   - Terminates TLS. The service rebuilds DPoP `htu` as https://<Host><path>,
#     so HAProxy must keep the client's Host header (it does by default).
#   - Absorbs any number of client connections while keeping each node below
#     its accept limit: fs2/Ember listen with the JDK's default backlog of 50,
#     so a burst of new connections beyond that is reset by the node's kernel.
#     `maxconn` per server keeps HAProxy's pool under it and queues the rest.
#   - Takes a node out of rotation while it drains on shutdown (see backend).
#
# Run it on its own machines: on a node's own cores it competes with the
# service for CPU. Validate with `haproxy -c -f haproxy.cfg`.

global
    log stdout format raw local0 info
    maxconn 100000
    # nbthread is left unset: one thread per available CPU.
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305

defaults
    mode http
    log global
    option httplog
    option forwardfor
    option http-keep-alive
    http-reuse safe
    timeout connect         3s
    timeout client          30s
    timeout http-request    5s      # slow-header clients (slowloris)
    timeout http-keep-alive 60s
    # Longer than the service's http.request-timeout (10 s), so the service
    # answers with its own 503 before HAProxy gives up on it.
    timeout server          15s
    # A request that waits this long for a free connection to a node gets 503.
    timeout queue           2s
    timeout check           1s
    # Retry only when the request never reached a node. Retrying after a
    # response started (or a 503) could run a non-idempotent request twice.
    retries 2
    retry-on conn-failure
    option redispatch

frontend api
    bind :443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1
    # For RFC 8705 certificate-bound tokens, replace the line above with this
    # one: it asks clients for a certificate and accepts self-signed ones (the
    # token's cnf.x5t#S256 binding, checked by the service, is the trust
    # anchor). Also set auth.mtls-forwarded-cert-header on the nodes.
    # bind :443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1 ca-file /etc/haproxy/client-ca.pem verify optional ca-ignore-err all crt-ignore-err all
    bind :80
    http-request redirect scheme https code 301 unless { ssl_fc }
    maxconn 50000

    # Never pass on a client-supplied certificate header: with it, anyone
    # holding a stolen token could present its (public) certificate and pass
    # the binding check. Then forward the certificate actually presented on
    # this connection, as the URL-encoded PEM the service expects.
    http-request del-header X-Forwarded-Client-Cert
    http-request set-header X-Forwarded-Client-Cert "-----BEGIN%%20CERTIFICATE-----%%0A%[ssl_c_der,base64,url_enc]%%0A-----END%%20CERTIFICATE-----%%0A" if { ssl_c_used }

    default_backend auth_nodes

backend auth_nodes
    balance leastconn
    option httpchk
    http-check send meth GET uri /ready
    http-check expect status 200
    # Draining: on SIGTERM a node fails /ready for http.drain-delay (5 s) while
    # still serving. Two failed checks 2 s apart (plus the 1 s check timeout)
    # take it out of rotation inside that window, so no request meets a closed
    # port. slowstart ramps a returning node's share over 10 s while its JIT
    # warms up.
    #
    # maxconn 40 keeps each node under its 50-connection accept limit. With
    # several HAProxy instances in front of the same nodes, divide it between
    # them (e.g. 20 each for two).
    default-server check inter 2s fall 2 rise 2 slowstart 10s maxconn 40
    server node1 10.0.0.11:8080
    server node2 10.0.0.12:8080

frontend stats
    bind 127.0.0.1:8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats

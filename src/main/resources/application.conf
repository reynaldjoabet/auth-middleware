app {

  http {
    host             = "0.0.0.0"
    host             = ${?HTTP_HOST}
    port             = 8080
    port             = ${?HTTP_PORT}
    idle-timeout     = 60 seconds
    # Shutdown: fail readiness and keep serving for drain-delay (the load
    # balancer stops routing here), then drain in-flight requests for up to
    # shutdown-timeout. drain-delay + shutdown-timeout must be < the platform's
    # termination grace period (Kubernetes default: 30 s).
    drain-delay      = 5 seconds
    drain-delay      = ${?HTTP_DRAIN_DELAY}
    shutdown-timeout = 20 seconds
    max-connections  = 1024
    # Requests handled at once before the excess is shed with 503 + Retry-After.
    # Size from a load test: in-flight ≈ throughput × latency (Little's law).
    max-in-flight    = 1024
    max-in-flight    = ${?HTTP_MAX_IN_FLIGHT}
    # Past this the client gets 503 and the handler is cancelled.
    request-timeout  = 10 seconds
  }

  db {
    host                     = "localhost"
    host                     = ${?DB_HOST}
    port                     = 5432
    port                     = ${?DB_PORT}
    name                     = "auth"
    name                     = ${?DB_NAME}
    user                     = "auth"
    user                     = ${?DB_USER}
    # No default: a missing DB_PASSWORD must fail the boot, never fall back to blank.
    password                 = ${DB_PASSWORD}
    max-pool-size            = 10           # DB is the bottleneck, not threads; size to the DB, not the CPU
    connect-timeout          = 5 seconds
    max-lifetime             = 30 minutes   # keep below the DB/LB idle cutoff
    leak-detection-threshold = 10 seconds

    # Apply pending Flyway migrations (classpath:db/migration) before the server
    # binds; a failure aborts the boot. Flyway locks the database for the
    # duration, so rolling out N replicas at once is safe. Set false where
    # migrations are a separate deploy step.
    migrate-on-start = true
    migrate-on-start = ${?DB_MIGRATE_ON_START}
    # One-shot: adopt Flyway on a database that already carries the schema.
    # Baselines the current state instead of failing — which also SKIPS V1, so
    # never leave this on (an empty database would come up empty).
    baseline-on-migrate = false
    baseline-on-migrate = ${?DB_BASELINE_ON_MIGRATE}
  }

  auth {
    # Security-critical and environment-specific: required, no insecure defaults.
    issuer   = ${AUTH_ISSUER}
    audience = ${AUTH_AUDIENCE}
    jwks-uri = ${AUTH_JWKS_URI}

    # RFC 9449 DPoP sender-constrained tokens.
    dpop {
      enabled = true
      enabled = ${?DPOP_ENABLED}

      # Server-provided nonces (RFC 9449 §8-9) — the FAPI 2.0 fix for DPoP
      # Proof Replay. Stateless Duende-pattern nonces: an AES-GCM-encrypted
      # server timestamp, no shared store needed.
      nonce {
        enabled = true
        enabled = ${?DPOP_NONCE_ENABLED}
        # Multi-node replay posture (MultiNodeMain): `stateless` = shared-key
        # nonces + a shared Redis set of spent proof jtis (1 Redis write per
        # request); `redis` = single-use nonces stored in Redis (2 round trips
        # per request, one in-flight request per nonce per client).
        mode = stateless
        mode = ${?DPOP_NONCE_MODE}
        # base64-encoded 16/24/32-byte AES key, shared by every node via the
        # secret manager. Absent → an ephemeral per-process key (single-node /
        # dev only; the boot logs a warning).
        key = ${?DPOP_NONCE_KEY}
        # Retired minting keys still accepted while rotating `key`; drop each
        # one nonce-lifetime after the roll.
        previous-keys = []
        lifetime = 5 minutes
      }
    }

    # Application-wide enforcement (http.filters.AccessTokenAuthFilter) — the
    # Play counterpart of the Scala stack's AccessTokenAuth middleware.
    # Disabled by default: annotation-composed routes (@RequireOAuth2 …) are
    # the default posture. When enabled, every route outside exclude-paths
    # must present a valid token; annotations still layer their stricter
    # per-route policy on top (the pipeline never runs twice).
    filter {
      enabled = false
      enabled = ${?AUTH_FILTER_ENABLED}
      # Reject plain Bearer everywhere — the SenderConstraintPolicy.Required
      # posture. Leave false to accept Bearer and enforce cnf bindings when present.
      require-dpop = false
      # RFC 7662 revocation check on every request (adds a network hop, fails closed).
      introspect = false
      # Prefix-matched open routes: liveness/readiness must stay unauthenticated.
      exclude-paths = ["/health", "/ready"]
    }

    # RFC 8705 certificate-bound tokens behind a TLS-terminating proxy: the
    # header carrying the client certificate as URL-encoded PEM (e.g.
    # "X-Forwarded-Client-Cert", as deploy/haproxy/haproxy.cfg sets it).
    # Unset = no certificate source, so certificate-bound tokens are rejected.
    # Enable ONLY behind a proxy that strips any client-supplied copy of this
    # header, and never where clients can reach the service directly.
    mtls-forwarded-cert-header = ${?AUTH_MTLS_FORWARDED_CERT_HEADER}

    # Hot-path caches, per node.
    cache {
      # Verified tokens remembered (keyed by SHA-256) so a reused token skips
      # signature verification. Changes no decision: exp is honoured and
      # revocation still runs every request. 0 disables.
      verified-tokens    = 100000
      # Cap on reusing one verification; keep <= the JWKS cache TTL (15 min).
      verified-token-ttl = 5 minutes
      # How long a node reuses a denylist answer. This IS the worst-case delay
      # before a revocation takes effect on a node, traded for taking almost
      # every per-request Redis read away. 0 = ask Redis on every request.
      revocation-ttl     = 1 second
      revocation-ttl     = ${?AUTH_REVOCATION_CACHE_TTL}
    }

    # RFC 7662 token introspection against the AS: immediate cluster-wide
    # revocation without a shared denylist. Fails closed; adds a network hop
    # bounded by request-timeout and amortised by cache-ttl.
    introspection {
      enabled = false
      enabled = ${?AUTH_INTROSPECTION_ENABLED}
      # Required when enabled (the boot fails otherwise); https only.
      endpoint      = ${?AUTH_INTROSPECTION_ENDPOINT}
      client-id     = ${?AUTH_INTROSPECTION_CLIENT_ID}
      client-secret = ${?AUTH_INTROSPECTION_CLIENT_SECRET}
      cache-ttl       = 10 seconds  # worst-case revocation latency; 0 disables caching
      request-timeout = 2 seconds   # a stalled AS fails closed, never pins threads
    }
  }

  # Named rate-limit policies for @RateLimited (resolved by http.RateLimitRegistry).
  # Token-bucket semantics: `permits` refill continuously over `window`.
  rate-limits {
    default { permits = 100, window = 1 minute }
    # Token endpoints are abuse magnets and each hit costs crypto work: keep tight.
    token   { permits = 10,  window = 1 minute }
  }

  # Where the shared auth state lives (revocation denylist, spent DPoP proof
  # jtis, single-use DPoP nonces): redis (the redis block below) or postgres
  # (the db database above, tables from db/migration V2).
  store {
    backend = redis
    backend = ${?STORE_BACKEND}
    postgres {
      # Connections held for the stores, apart from the HikariCP pool; each
      # runs one statement at a time.
      sessions         = 16
      sessions         = ${?STORE_PG_SESSIONS}
      # One store call, including waiting for a session; past it the request
      # fails closed with 503. Also the sessions' statement_timeout.
      command-timeout  = 250 milliseconds
      # off: a write is acknowledged before its WAL reaches disk. A crash can
      # lose the last few hundred ms of spent jtis and nonces, nothing else.
      synchronous-commit = false
      synchronous-commit = ${?STORE_PG_SYNCHRONOUS_COMMIT}
      # Concurrent calls of one kind answered by one statement, at most. A
      # batch only grows while calls arrive faster than statements finish, so
      # it adds no wait at low load. 1 = one statement per call.
      max-batch        = 256
      max-batch        = ${?STORE_PG_MAX_BATCH}
      sweep-interval   = 30 seconds
      sweep-batch      = 1000
    }
  }

  # Distributed token-revocation store (Sage Redis/Valkey client).
  redis {
    mode  = standalone          # standalone | cluster
    mode  = ${?REDIS_MODE}
    nodes = [ { host = "localhost", port = 6379 } ]
    # nodes = [ {host=r1,port=6379}, {host=r2,port=6379} ]  # cluster seeds
    username = "default"
    username = ${?REDIS_USERNAME}
    # No default: in production REDIS_PASSWORD is required; omit it only for local dev.
    password = ${?REDIS_PASSWORD}
    database = 0
    tls      = false            # set true (and provide a real password) in production
    tls      = ${?REDIS_TLS}
    client-name     = "auth-middleware"
    connect-timeout = 10 seconds
    ping-interval   = 60 seconds
    ping-timeout    = 30 seconds
    # Bound on one hot-path command (denylist EXISTS, DPoP jti SET NX); past it
    # the request fails closed with 503 instead of hanging.
    command-timeout = 250 milliseconds
  }
}

# Guice wiring for the Play (Java) annotation middleware. Reads the same
# app.auth.* tree as the Scala stack, so both share one source of truth.
play.modules.enabled += "auth.AuthModule"

# Application-wide token authentication; a no-op passthrough until
# app.auth.filter.enabled is set (see that block above).
play.filters.enabled += "http.filters.AccessTokenAuthFilter"

# Configuration for the ZIO service (auth.Main), read with zio-config
# (auth.ServiceConfig). Same keys and environment variables as the http4s
# service's application.conf, limited to what this service uses: it has no
# database, DPoP or introspection.
app {

  # trace, debug, info, warn or error
  log-level = info
  log-level = ${?LOG_LEVEL}

  http {
    host             = "0.0.0.0"
    host             = ${?HTTP_HOST}
    port             = 8080
    port             = ${?HTTP_PORT}
    idle-timeout     = 60 seconds
    shutdown-timeout = 20 seconds
    # Requests handled at once before the excess is shed with 503 + Retry-After.
    max-in-flight    = 1024
    max-in-flight    = ${?HTTP_MAX_IN_FLIGHT}
    # Past this the client gets 503 and the handler is interrupted.
    request-timeout  = 10 seconds
  }

  auth {
    # Security-critical and environment-specific: required, no insecure defaults.
    issuer   = ${AUTH_ISSUER}
    audience = ${AUTH_AUDIENCE}
    jwks-uri = ${AUTH_JWKS_URI}

    # Hot-path caches, per node.
    cache {
      # Verified tokens remembered (keyed by SHA-256) so a reused token skips
      # signature verification. Changes no decision. 0 disables.
      verified-tokens    = 100000
      # Cap on reusing one verification; keep <= the JWKS cache TTL (15 min).
      verified-token-ttl = 5 minutes
      # Worst-case delay before a revocation takes effect on a node, traded for
      # taking almost every per-request Redis read away. 0 = ask Redis every time.
      revocation-ttl     = 1 second
      revocation-ttl     = ${?AUTH_REVOCATION_CACHE_TTL}
    }
  }

  # Token-revocation denylist (Sage Redis/Valkey client).
  redis {
    mode  = standalone          # standalone | cluster
    mode  = ${?REDIS_MODE}
    nodes = [ { host = "localhost", port = 6379 } ]
    username = "default"
    username = ${?REDIS_USERNAME}
    # No default: in production REDIS_PASSWORD is required; omit it only for local dev.
    password = ${?REDIS_PASSWORD}
    database = 0
    tls      = false
    tls      = ${?REDIS_TLS}
    client-name     = "auth-middleware-zio"
    connect-timeout = 10 seconds
    ping-interval   = 60 seconds
    ping-timeout    = 30 seconds
    # Bound on one denylist lookup; past it the request fails closed with 503.
    command-timeout = 250 milliseconds
  }
}

name: Scala CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly run catches breakage from outside the repo - upstream releases,
  # runner image changes - on days with no commits. Drop if not wanted.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Give the compiler room for the Iron/jsoniter macro expansions.
  SBT_OPTS: -Xmx4g -XX:ReservedCodeCacheSize=512m

jobs:
  # Formatting is independent of Scala and JDK version, so it runs once here
  # rather than being repeated in every matrix leg.
  lint:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: 'sbt'
          cache-dependency-path: |
            **/*.sbt
            **/project/build.properties
            **/project/*.scala
            **/project/**/*.scala

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Check formatting
        run: sbt -v "scalafmtSbtCheck; scalafmtCheckAll; core/scalafmtCheckAll; zio/scalafmtCheckAll; bench/scalafmtCheckAll"

  build:
    name: Scala ${{ matrix.scala }} / Java ${{ matrix.java }} (${{ matrix.distribution }})
    # Gate on formatting so a misformatted PR fails in one cheap job rather
    # than burning every matrix leg.
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # For PostgresStoresSpec, which is skipped when TEST_POSTGRES_PORT is unset.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: auth
          POSTGRES_PASSWORD: auth
          POSTGRES_DB: auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # For KafkaInvalidationsSpec, skipped when TEST_KAFKA_BOOTSTRAP is unset.
      # The image's defaults are a single KRaft node advertising localhost:9092.
      kafka:
        image: apache/kafka:4.1.0
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20

    env:
      TEST_POSTGRES_PORT: '5432'
      TEST_POSTGRES_PASSWORD: auth
      TEST_KAFKA_BOOTSTRAP: localhost:9092

    strategy:
      fail-fast: false
      matrix:
        # sage-client 0.4.0 requires scala3-library 3.9.0, which sets the floor
        # for this build. A 3.3.x LTS leg would need sage 0.3.1 and Play 3.0.x.
        scala: ['3.9.0']
        # -java-output-version:21 makes 21 the minimum supported runtime; 25 is
        # verified so the service can run on either.
        java: ['21', '25']

        distribution: [temurin, corretto]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java ${{ matrix.java }} (${{ matrix.distribution }})
        uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
          cache: 'sbt'
          check-latest: false
          cache-dependency-path: |
            **/*.sbt
            **/project/build.properties
            **/project/*.scala
            **/project/**/*.scala

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Compile and test
        run: sbt -v "++${{ matrix.scala }}" "Test/compile; core/testFull; testFull; zio/testFull; bench/Jmh/compile; Docker/stage"
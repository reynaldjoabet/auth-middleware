name: Benchmark

# A/B load test (bench/loadtest/compare.sh): this commit against a base commit,
# both built and run on the same runner with rounds alternating, the shared
# auth state in Redis. The result is a per-scenario table in the job summary
# (and on the PR), plus the raw results as an artifact.
#
# Not on every push, it takes 30-40 minutes. Run it:
#   - from the Actions tab ("Run workflow"), optionally naming the base, or
#   - on a PR, by adding the `benchmark` label (and on each push while it has it)
on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Ref to compare against (empty: main, or HEAD~1 when run on main)'
        required: false
        default: ''
      rounds:
        description: 'Rounds per side (median taken)'
        required: false
        default: '2'
      duration:
        description: 'Length of each Bearer scenario'
        required: false
        default: '15s'
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Load test vs base (Redis)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'benchmark')
    # Pinned rather than ubuntu-latest: an image change between two runs would
    # show up as a performance change.
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout (full history, for the base commit)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: 'sbt'
          cache-dependency-path: |
            **/*.sbt
            **/project/build.properties
            **/project/*.scala

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Install load-test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server wrk
          # The package starts a Redis on 6379; run.sh starts its own there.
          sudo systemctl stop redis-server
          # The image ships PostgreSQL with its binaries off PATH; run.sh needs
          # initdb and pg_ctl for the service's database.
          printf '%s\n' /usr/lib/postgresql/*/bin | sort -V | tail -1 >> "$GITHUB_PATH"
          echo "cores: $(nproc), memory: $(free -g | awk '/Mem:/ {print $2}') GB"

      - name: Resolve the base commit
        id: base
        env:
          INPUT_BASE: ${{ inputs.base }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$INPUT_BASE" ]]; then base=$INPUT_BASE
          elif [[ -n "$PR_BASE_SHA" ]]; then base=$PR_BASE_SHA
          elif [[ "$GITHUB_REF_NAME" == main ]]; then base=HEAD~1
          else base=origin/main
          fi
          echo "ref=$base" >> "$GITHUB_OUTPUT"
          echo "Comparing $(git rev-parse --short HEAD) against $base ($(git rev-parse --short "$base"))"

      - name: A/B load test
        env:
          STORE: redis
          ROUNDS: ${{ inputs.rounds || '2' }}
          DURATION: ${{ inputs.duration || '15s' }}
          DPOP_DURATION: 10s
          # Fewer proofs than the local default: minting them is slow on 4
          # cores, and 10 s of DPoP load needs far fewer than 150 000.
          PROOFS: '60000'
        run: bench/loadtest/compare.sh "${{ steps.base.outputs.ref }}"

      - name: Job summary
        if: always()
        run: |
          if [[ -f target/bench-compare/comparison.md ]]; then
            cat target/bench-compare/comparison.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No comparison was produced; see the run logs and the artifact." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ github.run_id }}
          path: target/bench-compare/
          retention-days: 30
          if-no-files-found: ignore

      - name: Comment on the PR
        if: github.event_name == 'pull_request' && hashFiles('target/bench-compare/comparison.md') != ''
        # A PR from a fork gets a read-only token; the summary still has it.
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- auth-middleware-benchmark -->';
            const body = `${marker}\n${fs.readFileSync('target/bench-compare/comparison.md', 'utf8')}` +
              `\n[Run and raw results](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find(c => c.body && c.body.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
